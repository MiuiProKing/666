name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - lumorax-build

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project LUMORAX.xcodeproj \
            -scheme LUMORAX

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project LUMORAX.xcodeproj \
            -scheme LUMORAX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/LUMORAX.app"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/LUMORAX-unsigned.ipa
          shasum -a 256 build/LUMORAX-unsigned.ipa | tee build/LUMORAX-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUMORAX-unsigned-ipa
          path: |
            build/LUMORAX-unsigned.ipa
            build/LUMORAX-unsigned.ipa.sha256
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 7
