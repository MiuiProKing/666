name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor project
        run: npx cap sync ios

      - name: Build app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/App.app
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/LuckyJetExact.app
          /usr/bin/zip -qry LuckyJetExact-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuckyJetExact-unsigned-ipa
          path: LuckyJetExact-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
