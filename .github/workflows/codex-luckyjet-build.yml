name: Codex LuckyJet unsigned IPA

on:
  push:
    branches:
      - codex-ios-build-20260719
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-ios-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codex-ios-build/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate placeholder app artwork
        run: |
          set -euo pipefail
          printf 'P6\n1 1\n255\n\x0f\x15\x25' > /tmp/luckyjet.ppm
          sips -s format png -z 1024 1024 /tmp/luckyjet.ppm --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png >/dev/null
          sips -s format png -z 2732 2732 /tmp/luckyjet.ppm --out ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png >/dev/null
          cp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          cp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png

      - name: Sync Capacitor project
        run: npx cap sync ios

      - name: Build app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/App.app
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/LuckyJetExact.app
          /usr/bin/zip -qry LuckyJetExact-wrapper-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuckyJetExact-wrapper-unsigned-ipa
          path: codex-ios-build/LuckyJetExact-wrapper-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
